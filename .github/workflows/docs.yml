name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: python -m pip install --disable-pip-version-check "mkdocs==1.6.1"
      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f docs/Isogate-Complete-Documentation.md
          test ! -e docs/Isogate-Complete-Documentation.pdf
      - name: Build documentation
        run: mkdocs build --strict --site-dir site